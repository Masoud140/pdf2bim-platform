<title>BR13A Model Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: header strip, three tabs; the 3D canvas fills the working area with a control rail beside it (stacks under it on phones). */
:root {
  --bg: #f5f6f8; --panel: #ffffff; --fg: #1b2330; --muted: #5d6878; --line: #d8dde5; --accent: #2f5f9e;
  --ok: #1f7a4d; --warn: #a76a00; --bad: #b3261e; --canvas: #eef1f5;
  --r-girder: #2f5f9e; --r-slab: #9aa7b8; --r-cross: #7a4fb3; --r-sill: #b0602a; --r-pile: #5f6b3a; --r-link: #c03a6b; --r-rigid: #b8bfca; --r-edge: #3d8f8a;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --font-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161c; --panel: #1a2029; --fg: #e3e8ef; --muted: #98a3b3; --line: #2c3542; --accent: #79a6e6;
  --ok: #5fc58f; --warn: #e3a742; --bad: #f08079; --canvas: #0e1218;
  --r-girder: #79a6e6; --r-slab: #55606f; --r-cross: #b58ef0; --r-sill: #e39a5c; --r-pile: #a9b86a; --r-link: #f07aa5; --r-rigid: #4a5462; --r-edge: #6cc7c0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161c; --panel: #1a2029; --fg: #e3e8ef; --muted: #98a3b3; --line: #2c3542; --accent: #79a6e6;
  --ok: #5fc58f; --warn: #e3a742; --bad: #f08079; --canvas: #0e1218;
  --r-girder: #79a6e6; --r-slab: #55606f; --r-cross: #b58ef0; --r-sill: #e39a5c; --r-pile: #a9b86a; --r-link: #f07aa5; --r-rigid: #4a5462; --r-edge: #6cc7c0; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 28px; max-width: 1400px; margin-inline: auto; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; text-wrap: balance; }
.meta { color: var(--muted); font-size: 12.5px; }
.flag { font-family: var(--font-data); font-size: 11.5px; color: var(--warn); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
nav button { font: inherit; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 8px 12px; cursor: pointer; }
nav button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
nav button:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.work { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 14px; }
@media (max-width: 860px) { .work { grid-template-columns: minmax(0, 1fr); } }
.stage { position: relative; background: var(--canvas); border: 1px solid var(--line); border-radius: 6px; height: min(70vh, 640px); min-height: 360px; overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: absolute; left: 10px; bottom: 8px; font-family: var(--font-data); font-size: 11.5px; color: var(--muted); pointer-events: none; }
.rail { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.rail h2 { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 0 0 6px; }
.roles { display: grid; gap: 4px; }
.roles label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
.roles .sw { width: 14px; height: 4px; border-radius: 2px; }
.roles .n { margin-left: auto; font-family: var(--font-data); font-size: 11.5px; color: var(--muted); }
select, input[type=range] { width: 100%; font: inherit; }
select { padding: 6px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12.5px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.btns button { font: inherit; font-size: 12.5px; padding: 5px 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 4px; cursor: pointer; }
.note { font-size: 12px; color: var(--muted); line-height: 1.45; }
.grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; min-width: 0; }
.card h3 { font-size: 15px; font-weight: 600; margin: 0; }
.card p.note { margin: 4px 0 10px; }
.tw { overflow: auto; max-height: 460px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
td { font-family: var(--font-data); }
.pill { display: inline-block; font-family: var(--font-ui); font-size: 11.5px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
.svgbox { width: 100%; }
.svgbox text { font-family: var(--font-data); font-size: 11px; fill: var(--muted); }
.gsel { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.gsel button { font: inherit; font-size: 12.5px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--muted); cursor: pointer; }
.gsel button[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); }
.err { padding: 24px; color: var(--muted); }
</style>
